name: Python migration

on:
  push:
    paths:
      - "python_app/**"
      - "PA design App/src/modules/calculations/**"
      - "PA design App/assets/js/common/pa_lineup_canvas.js"
      - ".github/workflows/python-migration.yml"
  pull_request:
    paths:
      - "python_app/**"
      - "PA design App/src/modules/calculations/**"
      - "PA design App/assets/js/common/pa_lineup_canvas.js"
      - ".github/workflows/python-migration.yml"

permissions:
  contents: read

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_app/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: python_app/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci --ignore-scripts
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: node --check src/rfview/www/canvas_adapter.js
      - run: python -c "from rfview.app import app; print(type(app).__name__)"
      - name: Install browser
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Browser workflow regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m shiny run --host 127.0.0.1 --port 3840 src/rfview/app.py > preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat preview.log' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3840/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true
          python tests/browser_smoke.py http://127.0.0.1:3840
