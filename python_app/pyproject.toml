[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfview"
version = "0.1.0"
description = "Python migration of the RF Engineering Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "shiny==1.8.0",
  "pydantic==2.12.5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "playwright>=1.50,<2",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["rfview"]

[tool.setuptools.package-data]
rfview = ["www/*.js", "www/*.css", "examples/*.json"]
