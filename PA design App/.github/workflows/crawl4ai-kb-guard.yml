name: Crawl4AI KB Guard

on:
  push:
    branches: [ main ]
    paths:
      - 'PA design App/tools/crawl4ai_kb_ingestion/**'
      - 'PA design App/data/kb/**'
      - 'PA design App/docs/guides/CRAWL4AI_KB_INGESTION_GUARDRAILS.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'PA design App/tools/crawl4ai_kb_ingestion/**'
      - 'PA design App/data/kb/**'
      - 'PA design App/docs/guides/CRAWL4AI_KB_INGESTION_GUARDRAILS.md'
      - 'CLAUDE.md'

jobs:
  validate-kb-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Validate Crawl4AI KB pipeline
        run: |
          python "PA design App/tools/crawl4ai_kb_ingestion/validate_kb_pipeline.py"
