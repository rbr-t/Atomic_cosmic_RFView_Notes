app:
  name: "PA Design Assistant"
  version: "1.1.0"
  domain: "rf_pa_design"
  environment: ${APP_ENV:-development}

theme:
  mode: "dark"
  accent_color: "#ff7f11"
  primary_color: "#1b1b1b"

units:
  frequency: "GHz"
  power: "dBm"
  impedance: "Ohm"
  inductance: "nH"
  capacitance: "pF"
  voltage: "V"
  current: "A"

ai_agents:
  enabled: true
  model: "gpt-4"
  confidence_threshold: 0.7
  max_retries: 3
  timeout_seconds: 30
  mock_without_key: true  # Enable demo mode without API key

database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-5432}
  name: ${DB_NAME:-pa_design_app}
  user: ${DB_USER:-postgres}
  password: ${DB_PASSWORD:-postgres}
  pool_size: ${DB_POOL_SIZE:-10}
  ssl: ${DB_SSL:-false}

mcp_servers:
  - name: "ads_server"
    url: ${ADS_TOOL_URL:-http://localhost:8081}
    enabled: ${MCP_INTEGRATION:-false}
    tools:
      - "ads_run_simulation"
      - "ads_export_sparams"

  - name: "awr_server"
    url: ${AWR_TOOL_URL:-http://localhost:8082}
    enabled: ${MCP_INTEGRATION:-false}
    tools:
      - "awr_run_simulation"
      - "awr_export_data"

  - name: "vna_server"
    url: ${VNA_TOOL_URL:-http://localhost:8083}
    enabled: ${MCP_INTEGRATION:-false}
    tools:
      - "vna_measure_sparams"
      - "vna_calibrate"

knowledge_base:
  vector_db: "chroma"
  host: ${CHROMA_HOST:-localhost}
  port: ${CHROMA_PORT:-8000}
  collection: "rf_pa_knowledge"
  embedding_model: "text-embedding-ada-002"
  chunk_size: 500
  chunk_overlap: 50

security:
  auth_enabled: ${AUTH_ENABLED:-false}
  session_timeout: 3600
  encryption_enabled: true
  api_key_required: ${AUTH_ENABLED:-false}
  session_secret: ${SESSION_SECRET:-change_me_in_production}

storage:
  upload_dir: ${UPLOAD_DIR:-data/uploads}
  export_dir: ${EXPORT_DIR:-data/exports}
  cache_dir: ${CACHE_DIR:-data/cache}

logging:
  level: ${LOG_LEVEL:-INFO}
  file: ${LOG_DIR:-logs}/app.log
  max_size_mb: 100
  backup_count: 5

feature_flags:
  enable_ml_predictions: ${ML_PREDICTIONS:-true}
  enable_mcp_integration: ${MCP_INTEGRATION:-false}
  enable_chatbot: ${CHATBOT:-true}
  enable_real_time_collaboration: ${REAL_TIME_COLLABORATION:-false}

# Application ports
ports:
  app: ${APP_PORT:-3838}
  postgres: ${POSTGRES_PORT:-5432}
  chroma: ${CHROMA_PORT:-8000}
  pgadmin: ${PGADMIN_PORT:-5050}
